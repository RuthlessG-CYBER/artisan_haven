services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@artisan-haven/api-gateway"
    env_file:
      - .env
    depends_on:
      - catalog-service
      - customer-service
      - order-service

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@artisan-haven/catalog-service"
    env_file:
      - .env

  customer-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@artisan-haven/customer-service"
    env_file:
      - .env

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        WORKSPACE: "@artisan-haven/order-service"
    env_file:
      - .env
